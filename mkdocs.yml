site_name: Bells and Whistles
site_description: Bells and Whistles is a Railroader mod that adds Tender Bells, Flexible Connectors, Auxiliary Tenders, Driven Animation and Horn and Whistle for rolling-stock authors.
site_url: https://alex6511.github.io/BellsAndWhistles-Docs/
repo_url: https://github.com/Alex6511/BellsAndWhistles-Docs
repo_name: Alex6511/BellsAndWhistles-Docs
edit_uri: edit/main/docs/

theme:
  name: material
  # The site starts in the reader's system colour scheme. The toggle switches it by hand.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# "mkdocs build --strict" turns each of these warnings into an error.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Installing: installing.md
  # The section label differs from the title of its first page, authors.md ("For content
  # authors"), so the sidebar doesn't show the same label twice.
  - Authoring guides:
      - authors.md
      - Tender Bells: tender-bells.md
      - Flexible Connectors: flexible-connectors.md
      - Driven Animation: driven-animation.md
      - Horn and Whistle: horn-and-whistle.md
      - Auxiliary Tenders:
          - aux-tender/README.md
          - Virginian AE example: aux-tender/example/README.md
      # navigation.indexes turns the first README.md in a section into that section's index page.
      # This one-page section keeps component-kinds/README.md from becoming the index of
      # "Authoring guides".
      - Your own component kinds:
          - component-kinds/README.md
      # The editor guide comes after the feature pages, which explain what each setting does.
      - In-game editor: editor-authoring.md
  - What's new: whats-new.md
  - Contributing: development.md
